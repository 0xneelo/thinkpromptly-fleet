<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operator Goals</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root{
    --bg:#f7f6f2; --card:#ffffff; --fg:#1b1f24; --muted:#626a74; --line:#e4e2dc;
    --accent:#0f6b7a; --accent-soft:#e3f1f3; --quote:#f1f5f5; --focus:#0f6b7a;
    --ok:#1f8a4c; --warn:#b7791f; --bad:#c8322b; --idle:#9aa1a9;
    --sans:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12151a; --card:#1a1f27; --fg:#e7e9ec; --muted:#98a1ab; --line:#2b323b;
      --accent:#4fb3c3; --accent-soft:#173239; --quote:#1a262b; --focus:#4fb3c3;
      --ok:#3fbf72; --warn:#e0a83a; --bad:#f0655c; --idle:#6b737c;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12151a; --card:#1a1f27; --fg:#e7e9ec; --muted:#98a1ab; --line:#2b323b;
    --accent:#4fb3c3; --accent-soft:#173239; --quote:#1a262b; --focus:#4fb3c3;
    --ok:#3fbf72; --warn:#e0a83a; --bad:#f0655c; --idle:#6b737c;
  }
  *{box-sizing:border-box}
  body{background:var(--bg); color:var(--fg); margin:0; font:16px/1.5 var(--sans); font-variant-numeric:tabular-nums}
  .wrap{max-width:860px; margin:0 auto; padding:0 16px 64px}
  .top{position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line); padding:16px 0 12px; margin-bottom:18px}
  .top h1{font-size:22px; margin:0 0 4px; text-wrap:balance}
  .top h1 span{color:var(--accent)}
  .meta{color:var(--muted); font-size:13px; margin:0 0 10px; display:flex; gap:14px; flex-wrap:wrap}
  .meta b{color:var(--fg); font-weight:700}
  .chips{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  .chips button{background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:20px; padding:5px 12px; font:13px var(--sans); cursor:pointer}
  .chips button.on{background:var(--accent); border-color:var(--accent); color:#fff}
  .chips button:focus-visible, summary:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
  .chips .sp{flex:1}
  details.card{background:var(--card); border:1px solid var(--line); border-left:5px solid var(--stripe,var(--idle)); border-radius:10px; margin-bottom:10px; overflow:hidden}
  details.card[data-health="moving"]{--stripe:var(--ok)}
  details.card[data-health="stalled"]{--stripe:var(--warn)}
  details.card[data-health="blocked"]{--stripe:var(--bad)}
  details.card[data-status="done"]{--stripe:var(--accent)}
  details.card[data-status="parked"], details.card[data-status="dropped"]{--stripe:var(--idle); opacity:.8}
  details.card[hidden]{display:none}
  summary{list-style:none; cursor:pointer; padding:13px 16px 13px 14px; display:grid; grid-template-columns:auto 1fr auto; gap:6px 12px; align-items:start}
  summary::-webkit-details-marker{display:none}
  .badge{font-size:20px; line-height:1.3}
  .goal{font-size:19px; font-weight:700; margin:0; line-height:1.3; text-wrap:balance}
  .progress{color:var(--muted); font-size:14px; margin:2px 0 0}
  .id{font:600 12px var(--mono); color:var(--muted); white-space:nowrap; text-align:right}
  .id small{display:block; font:400 12px var(--sans); margin-top:2px}
  .arrow{grid-column:3; justify-self:end; font-size:11px; color:var(--muted); transition:transform .15s}
  details[open] .arrow{transform:rotate(90deg)}
  @media (prefers-reduced-motion: reduce){ .arrow{transition:none} }
  .body{border-top:1px solid var(--line); padding:12px 16px 14px 14px; font-size:14px; display:grid; gap:10px}
  .quote{background:var(--quote); border-left:3px solid var(--accent); border-radius:6px; padding:8px 12px; margin:0; font-style:italic}
  .row{margin:0}
  .row b{display:inline-block; min-width:60px; color:var(--muted); font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.06em}
  .tw{overflow-x:auto}
  table{width:100%; border-collapse:collapse; font-size:13px}
  th,td{text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top}
  th{color:var(--muted); font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.06em}
  code{font:12.5px var(--mono); background:var(--accent-soft); color:var(--fg); padding:1px 5px; border-radius:4px}
  .src, .log{color:var(--muted); font-size:12px; margin:0}
  .log{padding-left:16px}
  .empty{color:var(--muted); text-align:center; padding:48px 0}
</style>
<div class="wrap">
  <header class="top">
    <h1><span id="proj"></span> — what the operator wants</h1>
    <p class="meta" id="meta"></p>
    <div class="chips">
      <button data-f="open" class="on">Open</button>
      <button data-f="done">Done</button>
      <button data-f="all">All</button>
      <span class="sp"></span>
      <button id="toggle">Expand all</button>
    </div>
  </header>
  <main id="goals"></main>
</div>
<script>
const LEDGER = /*LEDGER*/;
const HEALTH = {moving:"🟢", stalled:"🟡", blocked:"🔴"};
const BADGE = {done:"✅", parked:"⏸", dropped:"🗑"};
const WORD = {"🟢":"moving","🟡":"stalled","🔴":"blocked","⏸":"parked","✅":"done","🗑":"dropped"};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const badge = g => BADGE[g.status] || HEALTH[g.health || "moving"] || "🟢";
const age = d => { const n = Math.round((Date.now() - new Date(d)) / 864e5); return isNaN(n) ? "" : n <= 0 ? "today" : n + "d ago"; };
const goals = LEDGER.goals || [];

document.getElementById("proj").textContent = LEDGER.project || "repo";
const tally = {};
goals.forEach(g => { const b = badge(g); tally[b] = (tally[b] || 0) + 1; });
document.getElementById("meta").innerHTML =
  (goals.length ? Object.entries(tally).map(([k, v]) => `<span>${k} <b>${v}</b> ${WORD[k]}</span>`).join("") : "<span>no goals yet</span>") +
  `<span>ledger <b>${esc(LEDGER.updated || "unsaved")}</b></span><span>rendered ${esc(LEDGER.rendered || "")}</span>`;

function taskRows(ts){
  if (!ts || !ts.length) return '<p class="src">no tasks attached yet</p>';
  return '<div class="tw"><table><tr><th></th><th>Task / lane</th><th>What</th><th>Who</th><th>Lane</th><th>State</th></tr>' +
    ts.map(t => `<tr><td>${esc(t.emoji || "")}</td><td><code>${esc(t.ref)}</code></td><td>${esc(t.title || "")}</td>` +
      `<td>${esc(t.who || "—")}</td><td>${t.lane ? "<code>" + esc(t.lane) + "</code>" : "—"}</td><td>${esc(t.state || "")}</td></tr>`).join("") +
    '</table></div>';
}

const main = document.getElementById("goals");
if (!goals.length) main.innerHTML = '<p class="empty">No goals recorded. Run <code>/adhd-goals</code> or <code>/adhd-goals set "…"</code>.</p>';
goals.forEach(g => {
  const d = document.createElement("details");
  d.className = "card"; d.dataset.status = g.status || "active"; d.dataset.health = g.health || "moving";
  d.innerHTML =
    `<summary><span class="badge">${badge(g)}</span><div><p class="goal">${esc(g.goal)}</p>` +
    `<p class="progress">${esc(g.progress || (g.status === "active" ? "no progress line yet" : g.status))}</p></div>` +
    `<span class="id">${esc(g.id)}<small>asked ${esc(g.asked)} · ${age(g.asked)}</small></span><span class="arrow">▶</span></summary>` +
    `<div class="body">` +
    (g.why ? `<p class="quote">“${esc(g.why)}”</p>` : "") +
    `<p class="row"><b>Next</b> ${esc(g.next || "—")}</p>` +
    `<p class="row"><b>Tasks</b> ${(g.tasks || []).length} attached</p>${taskRows(g.tasks)}` +
    (g.sources && g.sources.length ? `<p class="src">sources: ${g.sources.map(esc).join(" · ")}</p>` : "") +
    (g.log && g.log.length ? `<ul class="log">${g.log.slice(-5).map(l => `<li>${esc(l.at)} — ${esc(l.note)}</li>`).join("")}</ul>` : "") +
    `</div>`;
  main.appendChild(d);
});

const cards = [...document.querySelectorAll("details.card")];
function filter(f){
  cards.forEach(c => { const s = c.dataset.status;
    c.hidden = f === "all" ? false : f === "done" ? !(s === "done" || s === "dropped") : (s === "done" || s === "dropped"); });
  document.querySelectorAll(".chips [data-f]").forEach(b => b.classList.toggle("on", b.dataset.f === f));
}
document.querySelectorAll(".chips [data-f]").forEach(b => b.onclick = () => filter(b.dataset.f));
const tg = document.getElementById("toggle");
tg.onclick = () => { const open = tg.textContent.startsWith("Expand"); cards.forEach(c => { if (!c.hidden) c.open = open; }); tg.textContent = open ? "Collapse all" : "Expand all"; };
filter("open");
</script>
